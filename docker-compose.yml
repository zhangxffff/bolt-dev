services:
    init-perms:
        image: alpine:3.20
        user: "0:0"
        volumes:
            - home:/home
        command:
            ["sh", "-lc", "chown ${UID}:${GID} /home"]

    init-ssh:
        image: alpine:3.20
        user: "0:0"
        depends_on:
            init-perms:
                condition: service_completed_successfully
        environment:
            UID: ${UID}
            GID: ${GID}
        volumes:
            - home:/home/${DEV_USERNAME}
            - ~/.ssh:/host-ssh:ro
        command:
            - sh
            - -lc
            - |
                set -eu
                SSH_DIR=/home/${DEV_USERNAME}/.ssh
                mkdir -p "$$SSH_DIR"
                # Remove stale entries first (may be directories left over from
                # earlier bind-mount mistakes), then copy fresh from host.
                for f in authorized_keys id_ed25519 id_ed25519.pub; do
                    rm -rf "$$SSH_DIR/$$f"
                    if [ -f "/host-ssh/$$f" ]; then
                        cp "/host-ssh/$$f" "$$SSH_DIR/$$f"
                    fi
                done
                # known_hosts: seed once, preserve container-local additions.
                if [ ! -f "$$SSH_DIR/known_hosts" ]; then
                    rm -rf "$$SSH_DIR/known_hosts"
                    if [ -f /host-ssh/known_hosts ]; then
                        cp /host-ssh/known_hosts "$$SSH_DIR/known_hosts"
                    fi
                fi
                chown -R "$$UID:$$GID" "$$SSH_DIR"
                chmod 700 "$$SSH_DIR"
                chmod 600 "$$SSH_DIR/authorized_keys" "$$SSH_DIR/id_ed25519" "$$SSH_DIR/known_hosts" 2>/dev/null || true
                chmod 644 "$$SSH_DIR/id_ed25519.pub" 2>/dev/null || true

    dev:
        # Note: Running as root to allow sshd to bind port 22 and read host keys
        # User switching happens after SSH login
        # No container_name: lets `-p NAME` run isolated instances (containers
        # auto-named <project>-dev-1, each with its own <project>_home volume).
        image: bolt-dev
        privileged: true

        depends_on:
            init-perms:
                condition: service_completed_successfully
            init-ssh:
                condition: service_completed_successfully

        environment:
            HTTP_PROXY: ${HTTP_PROXY}
            HTTPS_PROXY: ${HTTPS_PROXY}
            NO_PROXY: ${NO_PROXY}
            # workspace dir under the dev user's home; used by entrypoint.sh
            DEV_WORKSPACE: ${DEV_WORKSPACE:-Workspace}
            # autossh reverse tunnel is skipped in entrypoint.sh unless both are set
            REVERSE_PROXY_HOST: ${REVERSE_PROXY_HOST:-}
            REVERSE_PROXY_PORT: ${REVERSE_PROXY_PORT:-}

        build:
            context: .
            dockerfile: Dockerfile
            args:
                BASE_IMAGE: ${BASE_IMAGE}
                UID: ${UID}
                GID: ${GID}
                USERNAME: ${DEV_USERNAME}
                PASSWORD: ${DEV_PASSWORD}
                HTTP_PROXY: ${HTTP_PROXY}
                HTTPS_PROXY: ${HTTPS_PROXY}
                NO_PROXY: ${NO_PROXY}

        # No published ports: the box is reached via the Cloudflare tunnel
        # (cloudflared -> dev:22 over the internal network) or the optional
        # autossh reverse tunnel. Local fallback: `docker compose exec dev`.

        volumes:
            - home:/home/${DEV_USERNAME}

        tty: true
        stdin_open: true

    # Cloudflare Tunnel sidecar — exposes the dev container (e.g. SSH on dev:22)
    # via routing set in the Zero Trust dashboard. Single knob:
    # CLOUDFLARE_TUNNEL_TOKEN in .env. No token -> cloudflared fails and exits
    # ONCE: restart is token-derived, so it's empty (Docker default "no") when
    # the token is blank, and "unless-stopped" when set. `dev` doesn't depend on
    # it, so a failed cloudflared never affects the rest of the stack.
    # Distroless image -> cloudflared's native entrypoint (no shell).
    cloudflared:
        image: cloudflare/cloudflared:latest
        restart: ${CLOUDFLARE_TUNNEL_TOKEN:+unless-stopped}
        depends_on:
            - dev
        environment:
            TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
            HTTP_PROXY: ${HTTP_PROXY}
            HTTPS_PROXY: ${HTTPS_PROXY}
            NO_PROXY: ${NO_PROXY}
        command: tunnel --no-autoupdate run

volumes:
    home:

services:
    init-perms:
        image: alpine:3.20
        user: "0:0"
        volumes:
            - home:/home
        command:
            ["sh", "-lc", "chown -R ${UID}:${GID} /home"]
    dev:
        # Note: Running as root to allow sshd to bind port 22 and read host keys
        # User switching happens after SSH login
        container_name: bolt-dev
        image: bolt-dev
        privileged: true

        environment:
            HTTP_PROXY: ${HTTP_PROXY}
            HTTPS_PROXY: ${HTTPS_PROXY}
            NO_PROXY: ${NO_PROXY}
            REVERSE_PROXY_HOST: ${REVERSE_PROXY_HOST}
            REVERSE_PROXY_PORT: ${REVERSE_PROXY_PORT}

        build:
            context: .
            dockerfile: Dockerfile
            args:
                BASE_IMAGE: ${BASE_IMAGE}
                UID: ${UID}
                GID: ${GID}
                USERNAME: ${DEV_USERNAME}
                PASSWORD: ${DEV_PASSWORD}
                HTTP_PROXY: ${HTTP_PROXY}
                HTTPS_PROXY: ${HTTPS_PROXY}
                NO_PROXY: ${NO_PROXY}

        ports:
            - "${HTTP_PORT}:${HTTP_PORT}"
            - "${SSH_PORT}:22"

        volumes:
            - home:/home/${DEV_USERNAME}
            - ~/.ssh/authorized_keys:/home/${DEV_USERNAME}/.ssh/authorized_keys:ro
            - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
            - ~/.ssh/known_hosts:/root/.ssh/known_hosts

        tty: true
        stdin_open: true

volumes:
    home:
